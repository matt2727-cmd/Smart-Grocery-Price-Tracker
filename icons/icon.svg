<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Ambient Glow circle -->
  <circle cx="256" cy="256" r="140" fill="#10B981" opacity="0.15" filter="url(#glow)" />

  <!-- Shopping Cart Body -->
  <g transform="translate(48, 64) scale(0.82)">
    <!-- Cart wheels -->
    <circle cx="160" cy="400" r="30" fill="url(#primaryGrad)" />
    <circle cx="340" cy="400" r="30" fill="url(#primaryGrad)" />
    <circle cx="160" cy="400" r="14" fill="#0F172A" />
    <circle cx="340" cy="400" r="14" fill="#0F172A" />

    <!-- Cart Basket Outline -->
    <path d="M 60 80 L 120 80 L 160 280 L 380 280 L 420 120 L 130 120" 
          fill="none" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Shield / Safety Symbol in Center -->
    <path d="M 270 150 L 330 175 V 230 C 330 270 270 300 270 300 C 270 300 210 270 210 230 V 175 Z"
          fill="url(#primaryGrad)" stroke="#10B981" stroke-width="6" />
    
    <!-- Checkmark inside Shield -->
    <path d="M 245 230 L 263 248 L 298 210" 
          fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Sparkle / Trend Up-Down indicator -->
    <circle cx="380" cy="70" r="24" fill="#EF4444" />
    <path d="M 380 60 L 370 76 H 390 Z" fill="#FFFFFF" />
  </g>
</svg>
